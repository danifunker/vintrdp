[package]
name = "vintrdp"
description = "RDP 4/5 client with native front-ends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/danifunker/vintrdp"

[dependencies]
keyring = "4.2.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vintrdp-core = { path = "../vintrdp-core" }

# macOS: AppKit (the objc2 framework crates enable all bindings by default)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
dispatch2 = "0.3.1"

# Linux and the BSDs: GTK 4
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
gtk4 = { version = "0.11.5", features = ["v4_12"] }

# Windows: Win32
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tiny-skia = "0.12.0"

# Asset paths are relative to this directory. cargo-deb and cargo-generate-rpm
# rewrite `target/release` to the build's real target directory.
[package.metadata.deb]
maintainer = "Dani Sarfati <dani@funkervogt.com>"
copyright = "2026 Dani Sarfati; rdesktop 1999-2016 Matthew Chapman et al."
license-file = ["../../LICENSE", "0"]
extended-description = "vintrdp connects to Windows NT 4.0 Terminal Server through Windows Server 2003 over RDP 4 and 5, with saved connections. It is a fork of rdesktop."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
  ["target/release/vintrdp", "usr/bin/vintrdp", "755"],
  ["linux/vintrdp.desktop", "usr/share/applications/vintrdp.desktop", "644"],
  ["assets/icons/icon-16.png", "usr/share/icons/hicolor/16x16/apps/vintrdp.png", "644"],
  ["assets/icons/icon-32.png", "usr/share/icons/hicolor/32x32/apps/vintrdp.png", "644"],
  ["assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/vintrdp.png", "644"],
  ["assets/icons/icon-64.png", "usr/share/icons/hicolor/64x64/apps/vintrdp.png", "644"],
  ["assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/vintrdp.png", "644"],
  ["assets/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/vintrdp.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/vintrdp", dest = "/usr/bin/vintrdp", mode = "755" },
  { source = "linux/vintrdp.desktop", dest = "/usr/share/applications/vintrdp.desktop", mode = "644" },
  { source = "assets/icons/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/vintrdp.png", mode = "644" },
  { source = "assets/icons/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/vintrdp.png", mode = "644" },
  { source = "assets/icons/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/vintrdp.png", mode = "644" },
  { source = "assets/icons/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/vintrdp.png", mode = "644" },
  { source = "assets/icons/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/vintrdp.png", mode = "644" },
  { source = "assets/icons/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/vintrdp.png", mode = "644" },
]
